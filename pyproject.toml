[tool.ruff]
# Shared lint/format config for backend/ and agent-runner/ (independent services,
# independent venvs — see Constitution Principle V — but one ruff config, since
# config is tooling, not runtime code). Run from either service dir or repo root;
# ruff walks up to find this file.
target-version = "py312"
line-length = 110
extend-exclude = ["frontend", "logs"]

[tool.ruff.lint]
# Defaults (pyflakes + a handful of pycodestyle rules) — deliberately not
# expanded yet so adopting ruff doesn't force an unrelated reflow of the
# existing codebase. Tighten deliberately, as its own change.
select = ["E4", "E7", "E9", "F"]
