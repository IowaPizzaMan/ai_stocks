version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aistock-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aistock
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aistock-backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/aistock
      AI_MODELS_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # AI Models service - disabled (requires GPU for optimal performance)
  # Uncomment to enable sentiment analysis and LLM-generated cases
  # ai_models:
  #   build:
  #     context: ./ai_models
  #     dockerfile: Dockerfile
  #   container_name: aistock-ai-models
  #   environment:
  #     OLLAMA_URL: http://host.docker.internal:11434
  #     BACKEND_URL: http://backend:8000
  #   ports:
  #     - "8001:8001"
  #   volumes:
  #     - ./ai_models:/app
  #     - huggingface_cache:/root/.cache/huggingface
  #   command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aistock-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  # huggingface_cache:  # Uncomment if ai_models service is enabled
