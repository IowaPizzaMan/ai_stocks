name: stockai

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--quiet"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # GPU passthrough lives in docker-compose.gpu.yml (target server):
    #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
    #
    # Models are pulled once into the ollama_models volume, not baked in:
    #   docker compose exec ollama ollama pull qwen3:14b            # chat / tagging (031/035)
    #   docker compose exec ollama ollama pull nomic-embed-text     # embeddings (036 — settings.ollama_embed_model)
    # nomic-embed-text is ~275 MB and runs resident alongside qwen3:14b
    # (036 research.md R1). See specs/036-news-semantic-search/quickstart.md.

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongodb:27017
      OLLAMA_URL: http://ollama:11434
    volumes:
      - ./logs:/logs
    depends_on:
      mongodb:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  agent-runner:
    build: ./agent-runner
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongodb:27017
      OLLAMA_URL: http://ollama:11434
    volumes:
      - ./logs:/logs
    depends_on:
      mongodb:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  mongo_data:
  ollama_models:
